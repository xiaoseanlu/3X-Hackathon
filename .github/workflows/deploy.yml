name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push prototype/ to gh-pages branch
        run: |
          # Configure git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Authenticate using the built-in token (GHE: use github.token, not secrets.GITHUB_TOKEN)
          git remote set-url origin "https://x-access-token:${{ github.token }}@${GITHUB_SERVER_URL#https://}/xlu02/TurboTax-Assistant.git"

          # Stage the prototype folder contents into a temp location
          cp -r prototype /tmp/prototype-deploy

          # Create or reset gh-pages as an orphan branch (no history bloat)
          git fetch origin gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages-new

          # Replace working tree with prototype contents only
          git rm -rf . --quiet
          cp -r /tmp/prototype-deploy/. .

          # Commit and force-push
          git add -A
          git commit -m "Deploy prototype — ${{ github.sha }}"
          git push origin gh-pages-new:gh-pages --force
